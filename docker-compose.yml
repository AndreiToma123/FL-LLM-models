name: flllmmodels   # keeps the Docker volume/image names stable even if the folder is renamed or moved
# Usage (PowerShell or bash), from the repo folder:
#   docker compose build
#   docker compose run --rm soapfl python -m fl_tools preflight
#   docker compose run --rm soapfl python -m fl_tools run --name smoke --bugs Lang-1
services:
  soapfl:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env                       # copy configs/ollama.env to .env and edit
    volumes:
      - .:/work                          # code lives in your repo folder
      # Defects4J checkouts, compiles and test runs create thousands of small files. On Windows a shared folder is
      # far too slow for that (tests hit SoapFL's hard 90 s limit). So results/ lives in a Docker volume instead;
      # copy the small summary files to your repo folder with:  python -m fl_tools export results/<name>
      - fl_results:/work/results
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on the host (Docker Desktop has this already)
    command: ["python", "-m", "fl_tools", "--help"]

volumes:
  fl_results:
